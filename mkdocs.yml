site_name: InvoiceNinja Plugin
site_description: A Claude Code plugin with skills for InvoiceNinja, on top of the invoiceninja-mcp server.
site_url: https://invoiceninja-plugin.marceltov.de/
repo_url: https://github.com/Marceltov/invoiceninja-plugin
repo_name: Marceltov/invoiceninja-plugin
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Guide:
      - Install and connect: install.md
      - Multiple instances: multiple-instances.md
      - Skills: skills.md
  - invoiceninja-mcp (the server): https://invoiceninja-mcp.marceltov.de/

extra_css:
  - stylesheets/extra.css
